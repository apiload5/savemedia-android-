name: Python CI - Tests and Lint

# Workflow ko in events par trigger karein:
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

# Python versions jin par tests run karne hain
env:
  PYTHON_VERSIONS: '[3.9, 3.10, 3.11]'

jobs:
  tests:
    name: Run Tests on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest

    # Strategy se hum multiple Python versions par test kar sakte hain
    strategy:
      matrix:
        python-version: [3.9, '3.10', '3.11']

    steps:
      - name: ⬇️ Checkout Code
        uses: actions/checkout@v4

      - name: 🐍 Setup Python ${{ matrix.python-version }}
        # Python environment set up karein
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          
      - name: 📦 Install Dependencies
        # Agar aap Pipenv ya Poetry use karte hain, toh command badal jayegi.
        # Aam taur par requirements.txt file use hoti hai.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Testing tools jaise pytest ya coverage install karein
          pip install pytest coverage

      - name: 🔬 Run Tests with Coverage
        # Pytest aur coverage report run karein
        run: |
          pytest --cov=. --cov-report=xml
        # Agar aapki tests folder mein hain toh path adjust karein

      - name: 📜 Upload Coverage Report (Optional)
        # Coverage report ko artifacts mein upload karein ya Codecov jaisi service par bhej dein
        uses: actions/upload-artifact@v4
        with:
          name: python-coverage-report-${{ matrix.python-version }}
          path: coverage.xml
          
  lint:
    name: Code Quality (Linting)
    runs-on: ubuntu-latest
    
    steps:
      - name: ⬇️ Checkout Code
        uses: actions/checkout@v4
        
      - name: 🐍 Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 🧹 Install Linting Tools
        # Flake8 ya Black jaisa koi tool install karein
        run: pip install flake8 black

      - name: 🔎 Run Flake8 for style checks
        # Flake8 code style aur basic bugs check karta hai
        run: flake8 .

      - name: 🎨 Check Code Formatting with Black
        # Black check karta hai ki code sahi se format hua hai ya nahi
        run: black --check .
        name: Python CI - Tests and Lint
