name: Android CI Build & Test

# Workflow को इन events पर trigger करें:
on:
  # 'main' branch पर push होने पर
  push:
    branches: [ "main" ]
  # 'main' branch के लिए pull request खुलने पर
  pull_request:
    branches: [ "main" ]
  # Manually run करने की अनुमति दें
  workflow_dispatch:

# Jobs की list
jobs:
  build_and_test:
    # Job का नाम
    name: Build, Test & Lint
    # Runner environment
    runs-on: ubuntu-latest
    
    # Steps की list
    steps:
      - name: ⬇️ Checkout Repository
        # Repository के कोड को runner पर लाने के लिए
        uses: actions/checkout@v4

      - name: ☕ Set up JDK 17
        # Java Development Kit (JDK) सेट अप करें
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin' # Recommended distribution
          java-version: '17'

      - name: ⚙️ Make gradlew executable
        # gradlew फ़ाइल को executable बनाएँ
        run: chmod +x ./gradlew

      - name: 📦 Cache Gradle Dependencies
        # Gradle dependencies को cache करें ताकि अगली बार build faster हो
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: 🔬 Run Unit Tests
        # Unit tests चलाएँ (bug-free code के लिए बहुत ज़रूरी)
        run: ./gradlew test --stacktrace

      - name: 🧹 Run Android Lint
        # Lint checks चलाएँ (कोड quality और potential bugs के लिए)
        run: ./gradlew lintDebug --stacktrace
      
      - name: ⚙️ Build Debug APK
        # Debug APK generate करें
        run: ./gradlew assembleDebug --stacktrace

      - name: ⬆️ Upload Debug APK as Artifact
        # APK को GitHub Actions Artifacts में upload करें
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
