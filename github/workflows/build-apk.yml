name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:  # Manual trigger

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Install Buildozer and dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          python3-pip \
          git \
          unzip \
          openjdk-11-jdk \
          zip \
          libncurses5 \
          libstdc++6
        pip3 install buildozer cython virtualenv

    - name: Build APK with Buildozer
      run: |
        buildozer init
        buildozer -v android debug

    - name: Upload APK artifact
      uses: actions/upload-artifact@v3
      with:
        name: savemedia-apk
        path: bin/*.apk
        retention-days: 30

    - name: Create Release
      if: github.ref == 'refs/heads/main'
      uses: softprops/action-gh-release@v1
      with:
        files: bin/*.apk
        tag_name: v1.0.${{ github.run_number }}
        name: Savemedia APK v1.0.${{ github.run_number }}
        body: |
          🚀 Automated APK Build
          
          **Download Links:**
          - Debug APK: Ready for testing
          - Built from: ${{ github.sha }}
          
          **Features:**
          ✅ Same UI as savemedia.online
          ✅ AdMob integration
          ✅ 30+ platforms support
          ✅ Multiple quality formats
